# Optional development inbox. It captures email locally and does not deliver to the Internet.
# Merge with the existing university compose.yml; do not start a new SQL project.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
    restart: unless-stopped
    ports:
      - '127.0.0.1:18026:8025'

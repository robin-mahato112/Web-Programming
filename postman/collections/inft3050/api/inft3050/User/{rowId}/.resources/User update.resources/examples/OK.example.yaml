$kind: http-example
request:
  url: "{{baseUrl}}/api/inft3050/User/:rowId"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    rowId: ""
  body:
    type: json
    content: "{}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "UserID": "<integer>",
        "UserName":"{{adminUsername}}",
        "Email": "<string>",
        "Name": "<string>",
        "IsAdmin": "<integer>",
        "Salt": "<string>",
        "HashPW":"{{newAccountPassword}}"
      }
order: 1000

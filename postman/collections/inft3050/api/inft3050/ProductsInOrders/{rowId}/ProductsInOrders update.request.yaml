$kind: http-request
description: "Partial update row in table by providing a key value pair object where key refers to the column alias. You need to only include columns which you want to update. NOTE: ProductsInOrders has no primary key, so :rowId matches on OrderId: read returns the first line only, while update/delete affect EVERY line of that order. Prefer the list endpoint with `where=(OrderId,eq,<id>)`. The product column is spelled `produktId` and references Stocktake.ItemId (not Product.ID)."
url: "{{baseUrl}}/api/inft3050/ProductsInOrders/:rowId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: rowId
    value: <string>
    description: (Required) Primary key of the record you want to read. If the table have composite primary key then combine them by using `___` and pass it as primary key.
body:
  type: json
  content: |-
    {
      "Quantity": "<integer>"
    }
examples: ./.resources/ProductsInOrders update.resources/examples
order: 2000

$kind: http-request
description: Get rows count of a table by applying optional filters.
url: "{{baseUrl}}/api/inft3050/Product/count"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: where
    value: <string>
    disabled: true
    description: "Filter rows using one or more conditions in the form `(field,operator,value)`. Supported operators: `eq`, `neq`, `gt`, `gte`, `lt`, `lte`, `like`, `nlike`, `is`, `isnot`. Use `is` / `isnot` with the value `null` to test for NULL. Combine conditions with `~and` or `~or`. Example: `where=(Name,like,Harry)~and(Price,lt,50)`. Field names must be real columns of the table; unknown columns and operators are ignored."
examples: ./.resources/Product count.resources/examples
order: 1000

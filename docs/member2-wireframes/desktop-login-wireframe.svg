  <text x="146" y="352" fill="#8393a7" font-family="Arial" font-size="15">jane.l.j.citizen@somemail.com</text>

  <text x="126" y="420" fill="#111827" font-family="Arial" font-size="16" font-weight="700">Password *</text>
  <rect x="126" y="438" width="408" height="54" rx="6" fill="#f8fafc" stroke="#9fb0c3"/>
  <text x="146" y="472" fill="#8393a7" font-family="Arial" font-size="15">Password123</text>

